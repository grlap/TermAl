name: Review integrity helpers

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # The launcher suite preflights `cargo` from PATH and, on Windows, Git
      # Bash at its default Program Files path; GitHub-hosted images have both.
      - name: Test review integrity helpers
        run: node --test scripts/review-freeze-fingerprint.test.mjs scripts/test-launcher.test.mjs scripts/test-temp-root.test.mjs scripts/vitest-resource-preflight.test.mjs
